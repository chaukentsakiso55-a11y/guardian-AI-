name: Android build

on:
  push:
    branches: ["main", "guardianai-v1-protection-build"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore GuardianAI source payload
        run: |
          cat .ci/guardian_chunk_*.b64 > /tmp/guardian_payload.b64
          base64 -d /tmp/guardian_payload.b64 > /tmp/guardian_payload.zip
          unzip -o /tmp/guardian_payload.zip -d .
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/cyberpulse/guardianai/MainActivity.kt')
          s = main.read_text()
          s = s.replace('OutlinedButton(Modifier.fillMaxWidth(), enabled = !busy, onClick = { onAuthenticated("Guest") })', 'OutlinedButton(onClick = { onAuthenticated("Guest") }, modifier = Modifier.fillMaxWidth(), enabled = !busy)')
          s = s.replace('Button(\n            Modifier.fillMaxWidth(),\n            onClick = { if (PinStore.verify(context, pin)) onDone() else error = "Incorrect PIN." },', 'Button(\n            onClick = { if (PinStore.verify(context, pin)) onDone() else error = "Incorrect PIN." },\n            modifier = Modifier.fillMaxWidth(),')
          s = s.replace('Button(\n                Modifier.fillMaxWidth(),\n                onClick = {', 'Button(\n                onClick = {', 1)
          s = s.replace('                    onComplete()\n                },\n                colors = ButtonDefaults.buttonColors(containerColor = Cyan, contentColor = Ink)', '                    onComplete()\n                },\n                modifier = Modifier.fillMaxWidth(),\n                colors = ButtonDefaults.buttonColors(containerColor = Cyan, contentColor = Ink)', 1)
          s = s.replace('Button(\n                    Modifier.fillMaxWidth(), onClick = {', 'Button(\n                    onClick = {')
          s = s.replace('                        }\n                    }, colors = ButtonDefaults.buttonColors(containerColor = Cyan, contentColor = Ink)', '                        }\n                    }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = Cyan, contentColor = Ink)', 1)
          s = s.replace('OutlinedButton(Modifier.fillMaxWidth(), onClick = { showDisablePin = true })', 'OutlinedButton(onClick = { showDisablePin = true }, modifier = Modifier.fillMaxWidth())')
          main.write_text(s)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('applicationId = "com.cyberpulse.guardianai"', 'applicationId = "com.cyberpulse.guardianAI"')
          g = g.replace('versionCode = 2', 'versionCode = 3')
          g = g.replace('versionName = "0.2.0"', 'versionName = "0.2.1"')
          gradle.write_text(g)

          strings = Path('app/src/main/res/values/strings.xml')
          x = strings.read_text()
          x = x.replace('YOUR_FIREBASE_WEB_CLIENT_ID.apps.googleusercontent.com', '911145387704-10o5530v7echo2ifj4qfbqm7r3cnd71r.apps.googleusercontent.com')
          strings.write_text(x)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: guardianai-firebase-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
